# =============================================================================
#  vantry.yml — comment CE projet se vérifie.
#
#  La seule étape que rien ne peut deviner. Sans ce fichier, verify.sh sort 2
#  et déclare la vérification UNDEFINED — délibérément fatal, parce qu'un reçu
#  fondé sur une supposition ne prouve rien.
# =============================================================================
version: 2
stack: "Next.js 15 (App Router, TypeScript) + Supabase (Postgres/RLS/Auth/Storage) + Stripe + API Claude, avec un worker conteneurisé distinct — voir docs/architecture/decisions/0001"
project_type: web
strictness: standard

run:
  install: pnpm install --frozen-lockfile
  # `verifier` enchaîne lint → typecheck → tests, et pas seulement les tests.
  #
  # `run.test` valait `pnpm test`, c'est-à-dire `vitest run` seul. Le gate
  # passait donc au vert avec un lint rouge et un type cassé — ce qui a été
  # constaté, pas supposé : deux erreurs `no-irregular-whitespace` ont survécu
  # à une vérification VERIFIED.
  #
  # Un contrôle qu'il faut penser à lancer à la main n'est pas un contrôle :
  # c'est une habitude, et une habitude se perd le jour où l'on est pressé.
  test: pnpm verifier
  build: pnpm build
  start: bash scripts/demarrer-web.sh
  ready: curl -sf "http://localhost:${PORT_WEB:-3100}/api/health"
  # Le smoke construit, démarre, et vérifie qu'une VRAIE page se rend et qu'une
  # VRAIE requête aboutit. Une suite de tests verte n'est pas une vérification :
  # c'est exactement à quoi ressemblait l'échec que cette porte existe pour
  # empêcher.
  smoke: bash tests/smoke/smoke.sh
  logs: .vantry/state/app.log

gates:
  verify_change: block
  security_review: block_on_sensitive
  code_review: warn
  design_review: warn

dispatch:
  max_parallel: 2
  confirm_before_fanout: true
  batch_prs: 1

merge:
  authority: human
  base: main

# Modifiable sans devoir une vérification : ni comportement, ni sécurité.
trivial_paths:
  - "README.md"
  - "LICENSE"
  - "LICENSES/**"
  - "THIRD_PARTY_NOTICES.md"
  - ".gitignore"
  - "docs/design/job-seeker/**"      # planches livrées par l'outil de design
  - "docs/planning/**"
  - "**/*.vantry-bak-*"

# Touche à l'authentification, à l'envoi sortant, à l'argent, aux données
# personnelles ou au contexte d'un modèle → revue de sécurité obligatoire.
# Cette liste alimente trois consommateurs : la porte locale, le job CI, et le
# routage de la revue humaine. Elle a une seule définition.
sensitive_paths:
  - "packages/env/**"
  # Ajoutés par la revue de sécurité de la PR #2 (constat F1) :
  #   parsing  — extrait le CV, donc la PII la plus lourde du produit
  #              (parcours, salaires) ; REQ-001 et OBL-1 en dépendent.
  #   matching — construit le contexte d'un LLM à partir du profil ET du texte
  #              d'offre, qui est une entrée hostile (REQ-011, OBL-6).
  - "packages/parsing/**"
  - "apps/worker/src/matching/**"
  # Une politique posée ici est ce qui sépare un CV de tout le monde. Le
  # constat F14 est né de l'absence d'une seule d'entre elles.
  - "supabase/migrations/**"
  # JOB-033 : `evaluerCompletude` décide `peutAutomatiser`. C'est un contrôle,
  # pas un affichage — l'écran ET le moteur s'y fient.
  # JOB-040 : engendre un document qui sera envoye en votre nom, a partir de
  # votre parcours. La contrainte qui l empeche d inventer vit ici.
  - "packages/documents/**"
  - "packages/profil/**"
  - "packages/auth/**"
  - "packages/audit/**"
  # Un journal est une surface de fuite : c'est là que la PII sort par accident.
  - "packages/observability/**"
  - "packages/llm-guard/**"
  - "packages/billing/**"
  - "packages/ratelimit/**"
  - "packages/retention/**"
  - "packages/mandate/**"
  - "apps/web/app/api/**"
  # JOB-032 : reçoit un fichier envoyé par l'utilisateur, le fait lire par un
  # modèle, puis écrit le profil. Trois raisons plutôt qu'une.
  - "apps/web/app/profil/import/**"
  # JOB-034 : écrit les exclusions et les mots rédhibitoires — ce qui décide
  # qu'une offre n'est jamais montrée.
  - "apps/web/app/criteres/**"
  # JOB-081 : c'est ici que la garde « rien ne sort pendant l'entrée » se lève.
  - "apps/web/app/entree/**"
  # JOB-053 : l'arrêt d'urgence. Le rendre inopérant serait la pire régression
  # possible de ce produit.
  - "apps/web/app/arret/**"
  # JOB-048 : c'est ici que quelqu'un autorise un envoi.
  - "apps/web/app/approbations/**"
  # ADR-0003 : le seul canal d'envoi autonome qui subsiste. Tout ce qui part au
  # nom de quelqu'un sort par là.
  - "apps/worker/src/envoi/**"
  - "apps/web/app/auth/**"
  # JOB-073 : décide qui est limité et sur quelle clé. Une erreur ici ne casse
  # rien de visible — elle rend simplement la limitation décorative.
  - "apps/web/lib/limitation/**"
  - "apps/worker/src/submission/**"
  - "apps/worker/src/contacts/**"
  - "apps/worker/src/mailbox/**"
  - "apps/worker/src/governance/**"
  - "apps/worker/src/receipts/**"
  - "apps/worker/src/documents/**"
  - "supabase/migrations/**"
  - "tests/rls/**"
  - ".github/workflows/**"
  - ".githooks/**"
  - "vantry.yml"
  - ".env.example"
  # Affaiblir un scanner de secrets est un changement de sécurité.
  - ".gitleaks.toml"
# ---------------------------------------------------------------- acceptance
# Les promesses qui SURVIVENT au ticket. Ajoutées à la fin d'une issue, quand
# elles passent, et jamais retirées : une régression sur REQ-011 dans six mois
# bloque le push de quelqu'un qui n'en a jamais entendu parler.
#
# NOTE (2026-08-27) : ce bloc n'existait pas après 63 issues livrées — une
# dérive par rapport à AGENTS.md, pas une décision. Les deux premières entrées
# sont posées ici avec JOB-049 ; les issues déjà livrées ne sont PAS
# reconstituées rétroactivement, ce qui serait inventer des critères après coup.
acceptance:
  - "AC-1 | REQ-011 | un canal ATS ne déclenche aucun envoi, même cadran sur agir-seule et mandat valide | pnpm exec vitest run packages/profil/src/canal.test.ts"
  - "AC-2 | REQ-011 | une destination sortante ne peut pas venir du texte d une annonce | pnpm exec vitest run apps/worker/src/envoi/destination.test.ts apps/worker/src/envoi/etanche.test.ts"
  - "AC-3 | REQ-011 | un envoi n est jamais rejoue, meme apres un plantage du worker | pnpm exec vitest run tests/rls/idempotence-envoi.test.ts"
  - "AC-4 | REQ-013 | toute action sortante produit un recu, et une action sans recu devient un incident visible | pnpm exec vitest run tests/rls/recus-reconciliation.test.ts"

